name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Cache Tree-sitter grammars used by tests
        run: python -c "from repoatlas.parsing import supported_grammar_names; from tree_sitter_language_pack import download, manifest_languages; requested=set(supported_grammar_names()); available=set(manifest_languages()); missing=sorted(requested-available); assert not missing, f'Unsupported Tree-sitter grammars: {missing}'; download(sorted(requested))"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=repoatlas --cov-report=term-missing --cov-fail-under=80
