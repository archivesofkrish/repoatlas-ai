[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoatlas-ai"
version = "0.6.0"
description = "Evidence-grounded code intelligence and interactive architecture exploration."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RepoAtlas AI contributors"}]
keywords = ["code-intelligence", "repository-analysis", "static-analysis", "RAG", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
parsing = ["tree-sitter-language-pack>=1.25,<2"]
llm = ["openai>=2.0,<3"]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<7", "ruff>=0.8,<1", "httpx2>=2,<3", "fastapi>=0.115,<1", "tree-sitter-language-pack>=1.25,<2"]

[project.scripts]
repoatlas = "repoatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
