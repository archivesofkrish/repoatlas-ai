[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoatlas-ai"
version = "0.1.0"
description = "Evidence-grounded codebase intelligence for understanding repositories safely."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RepoAtlas AI contributors"}]
keywords = ["code-intelligence", "repository-analysis", "static-analysis", "RAG", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[project.scripts]
repoatlas = "repoatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
